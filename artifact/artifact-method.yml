name: Python application

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # Temporarily suppress Node 20 warnings (optional)
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  Build-Job:
    runs-on: ubuntu-latest

    steps:

    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Setup Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Step 4: Lint with flake8
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

        # Treat remaining issues as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Step 5: Run tests and generate coverage report
    - name: Test with pytest and generate coverage
      run: |
        pytest --cov=. --cov-report=xml

    # Step 6: Verify coverage file
    - name: Check coverage report
      run: |
        ls -la
        test -f coverage.xml

    # Step 7: Upload coverage report as artifact
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    # Step 8: Login to Docker Hub
    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | \
        docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # Step 9: Build Docker image
    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:latest .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }} .

    # Step 10: Docker image security scan
    - name: Scan Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/flask-app:latest
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true

    # Step 11: Push Docker image
    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}

    # Step 12: Show image details
    - name: Image details
      run: |
        echo "Docker image pushed successfully!"
        echo "Image: ${{ secrets.DOCKER_USERNAME }}/flask-app:latest"
        echo "Image: ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}"

  Scanner:
    name: SonarQube-Scanner
    runs-on: ubuntu-latest
    needs: Build-Job

    steps:

    # Step 13: Checkout source code
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Step 14: Download coverage artifact
    - name: Download coverage report
      uses: actions/download-artifact@v4
      with:
        name: coverage-report
        path: .

    # Step 15: Verify downloaded coverage report
    - name: Check coverage report
      run: |
        ls -la
        test -f coverage.xml

    # Step 16: SonarQube Scan
    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # Step 17: Trigger Jenkins CD pipeline
    - name: Trigger Jenkins CD
      run: |
        curl -i -X POST \
        "http://15.206.194.186:8080/job/flaskapp/build?token=${{ secrets.JENKINS_JOB_TOKEN }}" \
        --user "${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}"
