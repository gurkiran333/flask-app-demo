name: Python application

on:
  push:
    branches: [ "main" ]
  #pull_request:
    #branches: [ "main" ]

permissions:
  contents: read

env:
  # Temporarily suppress Node 20 warnings (optional)
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  Build-Job:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - uses: actions/checkout@v4
    
    # Step 2: Setup Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    # Step 4: Lint with flake8
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    # Step 5: Test with pytest
    - name: Test with pytest
      run: |
        pytest
    
    # Step 6: Login to Docker Hub
    - name: Login to Docker Hub
      run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    
    # Step 7: Build Docker image
    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:latest .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }} .
    
    # Step 8: Push Docker image to Docker Hub
    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}
    
    # Step 9: Show image details
    - name: Image details
      run: |
        echo "Docker image pushed successfully!"
        echo "Image: ${{ secrets.DOCKER_USERNAME }}/flask-app:latest"
        echo "Image: ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}"
        echo "Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/flask-app"
    
    # Step 10: Optional - Basic security scan
    - name: Scan Docker image (Optional)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/flask-app:latest
        format: 'table'
        exit-code: '0'  # Don't fail the build
        severity: 'CRITICAL,HIGH'
      continue-on-error: true
